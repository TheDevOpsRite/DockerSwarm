name: Build and deploy
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: night-shift-moto
  SERVICE_NAME: night-shift-moto
  IMAGE_ARCHIVE: night-shift-moto.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "${IMAGE_NAME}:${GITHUB_SHA}" --file Dockerfile .

      - name: Export image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > "${IMAGE_ARCHIVE}"

      - name: Store image for deployment
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_ARCHIVE }}
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$SERVER_HOST" || { echo "Missing SERVER_HOST secret"; exit 1; }
          test -n "$SERVER_USER" || { echo "Missing SERVER_USER secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing SSH_KNOWN_HOSTS secret"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts

      - name: Copy image to Swarm manager
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_ARCHIVE: /tmp/night-shift-moto-${{ github.sha }}.tar.gz
        run: scp -P "$SERVER_PORT" "$IMAGE_ARCHIVE" "$SERVER_USER@$SERVER_HOST:$REMOTE_ARCHIVE"

      - name: Load image and update Swarm service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_ARCHIVE: /tmp/night-shift-moto-${{ github.sha }}.tar.gz
          IMAGE: night-shift-moto:${{ github.sha }}
          SERVICE: ${{ env.SERVICE_NAME }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "IMAGE='$IMAGE' SERVICE='$SERVICE' ARCHIVE='$REMOTE_ARCHIVE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          docker load --input "$ARCHIVE"
          rm -f "$ARCHIVE"

          if docker service inspect "$SERVICE" >/dev/null 2>&1; then
            docker service update \
              --image "$IMAGE" \
              --resolve-image never \
              --force \
              "$SERVICE"
          else
            docker service create \
              --name "$SERVICE" \
              --publish published=80,target=80,protocol=tcp,mode=ingress \
              --resolve-image never \
              "$IMAGE"
          fi

          docker service ls --filter "name=$SERVICE"
          REMOTE_SCRIPT